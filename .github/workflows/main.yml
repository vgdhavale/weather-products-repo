name: Generate weather products (GFS + Skew‑T)

on:
  schedule:
    # Daily at 00:30 UTC; adjust as needed
    - cron: "30 3 * * *"
  workflow_dispatch:  # allow manual runs

permissions:
  contents: read # Securely downgraded from write since we are no longer pushing code

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (for Matplotlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            libfreetype6-dev \
            libpng-dev \
            pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run weather products script
        run: |
          python weather_products.py

      - name: Upload Weather Products as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weather-forecast-products
          path: |
            imd_gfs_850_hPa_forecast.gif
            imd_gfs_images/
            sounding_plots/
          retention-days: 7 # Optional: Adjust or remove this to change how long GitHub stores the files (default is 90 days)
