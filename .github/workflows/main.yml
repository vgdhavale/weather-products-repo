name: IMD GFS + Skew-T → GitHub Pages

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * *'  # optional: daily at 06:00 UTC

permissions:
  contents: write

jobs:
  generate-and-push-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            gfortran \
            libatlas-base-dev \
            libopenblas-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            numpy pandas requests Pillow matplotlib metpy scipy

      - name: Run IMD GFS + Skew-T generator
        run: |
          python weather_products.py
        # Replace weather_products.py with the actual filename

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare files for GitHub Pages
        run: |
          # Create folders for Pages
          mkdir -p gfs skewt

          # Copy final GIFs
          if ls imd_gfs_downloads/*.gif 1>/dev/null 2>&1; then
            cp -f imd_gfs_downloads/*.gif gfs/
          else
            echo "No GFS GIFs found"
          fi

          # Copy final Skew-T PNGs
          if ls sounding_plots/*.png 1>/dev/null 2>&1; then
            cp -f sounding_plots/*.png skewt/
          else
            echo "No Skew-T PNGs found"
          fi

      - name: Commit and push outputs to main (for Pages)
        run: |
          # Stage only the web assets
          git add gfs/*.gif skewt/*.png || true

          if ! git diff --cached --quiet; then
            git commit -m "Update weather Pages assets: $(date -u +%Y-%m-%d_%H%M)_UTC"
            git push
          else
            echo "No new or changed files to commit."
          fi
