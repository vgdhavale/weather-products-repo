name: Deploy IMD GFS + Skew-T to GitHub Pages

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * *'  # optional: daily at 06:00 UTC

permissions:
  contents: write

jobs:
  generate-and-deploy-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            gfortran \
            libatlas-base-dev \
            libopenblas-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir \
            numpy pandas requests Pillow matplotlib metpy scipy

      - name: Run IMD GFS + Skew-T generator
        run: |
          python weather_products.py
        # Replace weather_products.py with your actual script filename

      - name: Prepare files for GitHub Pages
        run: |
          # Create output folder for Pages
          mkdir -p public/gfs public/skewt

          # Copy final GFS GIFs
          if ls imd_gfs_downloads/*.gif 1>/dev/null 2>&1; then
            cp -f imd_gfs_downloads/*.gif public/gfs/
          else
            echo "No GFS GIFs found"
          fi

          # Copy final Skew-T PNGs
          if ls sounding_plots/*.png 1>/dev/null 2>&1; then
            cp -f sounding_plots/*.png public/skewt/
          else
            echo "No Skew-T PNGs found"
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "Deploy weather products (GFS + Skew-T)"
          keep_files: false
          # keep_files: true  # if you want to preserve other files already on gh-pages
