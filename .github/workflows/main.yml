name: Generate weather products (3 GFS + Skew‑T)

on:
  schedule:
    # Daily at 00:30 UTC; adjust as needed
    - cron: "30 3 * * *"
  workflow_dispatch:  # allow manual runs

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (for Matplotlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            libfreetype6-dev \
            libpng-dev \
            pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      # NEW STEP: Wipe out old files and align perfectly with GitHub remote repository state
      - name: Fetch remote changes and clear local state
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Run weather products script
        run: |
          python weather_products.py

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # MODIFIED STEP: Safely overwrite and push without relying on manual conflict resolution
      - name: Commit and push generated products
        run: |
          git add imd_gfs_downloads/ sounding_plots/
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update weather products (3 GFS animations + Skew‑T) [skip ci]"
            
            # If a new remote commit happened while the script ran, force Git to favor the runner's new binaries
            git fetch origin main
            git rebase -X theirs origin/main
            
            git push origin main
          fi
