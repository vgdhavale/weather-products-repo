name: Generate weather products (GFS + Skew‑T)

on:
  schedule:
    # Daily at 00:30 UTC; adjust as needed
    - cron: "30 4 * * *"
  workflow_dispatch:  # allow manual runs

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (for Matplotlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            libfreetype6-dev \
            libpng-dev \
            pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run weather products script
        run: |
          python weather_products.py

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push generated products
        run: |
          git add imd_gfs_850_hPa_forecast.gif imd_gfs_images/ sounding_plots/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update weather products [skip ci]"
            git push
          fi
