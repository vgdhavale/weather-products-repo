name: Generate weather products (GFS + Skew-T)

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write      # Required for Pages
  id-token: write   # Required for Pages

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (for Matplotlib)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-dev \
            libfreetype6-dev \
            libpng-dev \
            pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run weather products script
        run: |
          python weather_products.py

      # NEW: Consolidate files into a single web directory
      - name: Organize web assets
        run: |
          mkdir -p public
          mv imd_gfs_850_hPa_forecast.gif public/
          mv imd_gfs_images public/
          mv sounding_plots public/

      # NEW: Upload the website directory artifact
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      # NEW: Deploy files to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
